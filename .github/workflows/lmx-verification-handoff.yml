name: lmx-verification-handoff

on:
  push:
    branches: [main]
    paths: [.github/workflows/lmx-verification-handoff.yml]

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: github.repository == 'tryingET/obsidian-plugins' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Specify separate dependency acceptance before test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lmx-evidence" docs/project
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > docs/project/2026-09-07-development-dependency-security.md <<'DOC'
          ---
          summary: "Separate test-first maintenance for development-tool advisories found during Layer Manager verification."
          read_when:
            - "You are reviewing September 2026 dependency security remediation."
          type: "review"
          ---

          # Development dependency security

          This is separate maintenance, not a Layer Manager feature or a new framework.
          The feature packet passed existing gates and the real-host matrix first.

          ## BDD acceptance before remediation

          Given locked dependencies and current npm and maintainer advisories, when the
          complete graph is reviewed, then all severities and affected maintained-version
          ranges must be considered, not only production or high/critical findings.
          Given an unmaintained vulnerable test runner, when upgrading to the supported
          patched version, then all source, test assertions, gate configurations, and
          thresholds remain unchanged, every existing gate passes, and the built script
          remains byte-identical to the host-tested artifact. Do not use --force or bypass
          peer constraints. A major runner upgrade must be explicit, not an audit side effect.

          ## Why a supported Vitest release is required

          The npm snapshot reported ten findings. Compatible audit-fix alone left Vitest
          unresolved. The maintainer advisory GHSA-82fw-gwwq-j7x9 explicitly says 3.x is
          unmaintained and the redirect-mock fix is available in 4.1.11; therefore a nominally
          clean older npm snapshot would not establish remediation of known advisories.
          Source: https://github.com/vitest-dev/vitest/security/advisories/GHSA-82fw-gwwq-j7x9
          The condition requires development-server access; no shipped LayerManager exploit
          is asserted. The repository uses Node 22 and the existing Vitest framework.

          ## TDD and evidence

          Run the full-graph audit before dependency changes and record its failure. Upgrade
          Vitest and its coupled coverage provider together, apply compatible transitive
          fixes, perform clean npm ci, require zero audit findings, and run every existing
          gate. The supported-version check and artifact hash are additional guards.
          Preserve the before/after audit JSON and full gate log. Zero findings is a dated
          database observation, not a universal security guarantee.
          DOC
          git add docs/project/2026-09-07-development-dependency-security.md
          git commit -m 'docs: specify supported development-tool security acceptance before remediation'
      - name: Record failing dependency regression
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'scripts.audit=npm audit --audit-level=low'
          set +e
          npm audit --json > "$RUNNER_TEMP/lmx-evidence/audit-before.json"
          result=$?
          set -e
          test "$result" -ne 0
          node -e 'const d=require(process.env.RUNNER_TEMP+"/lmx-evidence/audit-before.json");if(!(d.metadata.vulnerabilities.total>0))process.exit(1);console.log(d.metadata.vulnerabilities)'
          git add package.json
          git commit -m 'test: expose full-graph dependency audit and reproduce advisories'
      - name: Install explicitly selected supported runner and compatible fixes
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'overrides.vite=7.3.6'
          npm install --workspace=packages/obsidian-excalidraw-layer-manager --save-dev --save-exact vitest@4.1.11 @vitest/coverage-v8@4.1.11 --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/lmx-evidence/supported-update.log"
          npm audit fix --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/lmx-evidence/audit-fix.log"
          npm ci
          npm audit --json > "$RUNNER_TEMP/lmx-evidence/audit-after.json"
          npm run audit
          node -e 'for(const p of ["vitest","@vitest/coverage-v8"]){const v=require(p+"/package.json").version;if(v!=="4.1.11")throw Error(p+" "+v)}'
          git add package.json package-lock.json packages/obsidian-excalidraw-layer-manager/package.json
          git commit -m 'fix(deps): use supported Vitest security release and patched development dependencies'
      - name: Run unchanged full gate and prove artifact stability
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/lmx-evidence/check.log"
          npm --prefix packages/obsidian-excalidraw-layer-manager run build
          echo '651e881e6bfadd12f82513b6ff66cb30138333b4b7f1f86d8d972750bf220d1b  packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md' | sha256sum --check
          cmp packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md apps/lab-vault/Excalidraw/Scripts/LayerManager.md
      - name: Publish only a green fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
          git log -3 --oneline > "$RUNNER_TEMP/lmx-evidence/published-commits.txt"
          cp package.json package-lock.json "$RUNNER_TEMP/lmx-evidence/"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmx-dependency-verification
          retention-days: 7
          path: ${{ runner.temp }}/lmx-evidence/
          if-no-files-found: error
