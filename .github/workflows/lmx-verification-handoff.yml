name: lmx-verification-handoff

on:
  push:
    branches: [main]
    paths: [.github/workflows/lmx-verification-handoff.yml]

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: github.repository == 'tryingET/obsidian-plugins' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Specify separate dependency acceptance before audit test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lmx-evidence" docs/project
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > docs/project/2026-09-07-development-dependency-security.md <<'DOC'
          ---
          summary: "Separate test-first maintenance for development-tool advisories found during Layer Manager verification."
          read_when:
            - "You are reviewing September 2026 dependency security remediation."
          type: "review"
          ---

          # Development dependency security

          This is separate maintenance, not a Layer Manager feature or a new framework.
          The feature packet passed its existing gates and real-host matrix first.

          ## BDD acceptance before remediation

          Given existing locked dependencies and the current npm advisory database,
          when the full dependency graph is audited, then all severities must be
          considered, not only production dependencies or high/critical findings.
          Given vulnerable development dependencies, when compatible remediations are
          applied, then source, tests, configuration, and thresholds stay unchanged;
          every existing gate passes; the bundle stays byte-identical to the host-tested
          artifact. Do not use force upgrades or bypass peer constraints.

          ## TDD and evidence

          The audit must fail before dependency changes and return zero after a clean
          npm ci. Preserve both JSON reports and the full gate log. Initial compatible
          audit-fix left the coupled Vitest/coverage packages pinned; update them together
          within their existing declared ranges before re-auditing. Verification rejects
          any dependency change that alters the tested artifact.
          Zero findings is a dated database observation, not a universal security claim.
          DOC
          git add docs/project/2026-09-07-development-dependency-security.md
          git commit -m 'docs: define isolated dependency security acceptance before remediation'
      - name: Record failing dependency regression
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'scripts.audit=npm audit --audit-level=low'
          set +e
          npm audit --json > "$RUNNER_TEMP/lmx-evidence/audit-before.json"
          result=$?
          set -e
          test "$result" -ne 0
          node -e 'const d=require(process.env.RUNNER_TEMP+"/lmx-evidence/audit-before.json");if(!(d.metadata.vulnerabilities.total>0))process.exit(1);console.log(d.metadata.vulnerabilities)'
          git add package.json
          git commit -m 'test: expose full-graph dependency audit and reproduce advisories'
      - name: Apply compatible remediation only
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'overrides.vite=7.3.6'
          npm update vitest @vitest/coverage-v8 --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/lmx-evidence/coupled-update.log"
          npm audit fix --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/lmx-evidence/audit-fix.log"
          npm ci
          npm audit --json > "$RUNNER_TEMP/lmx-evidence/audit-after.json"
          npm run audit
          git add package.json package-lock.json
          git commit -m 'fix(deps): remediate development-tool advisories with compatible updates'
      - name: Run unchanged full gate and prove artifact stability
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/lmx-evidence/check.log"
          npm --prefix packages/obsidian-excalidraw-layer-manager run build
          echo '651e881e6bfadd12f82513b6ff66cb30138333b4b7f1f86d8d972750bf220d1b  packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md' | sha256sum --check
          cmp packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md apps/lab-vault/Excalidraw/Scripts/LayerManager.md
      - name: Publish only a green fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
          git log -3 --oneline > "$RUNNER_TEMP/lmx-evidence/published-commits.txt"
          cp package.json package-lock.json "$RUNNER_TEMP/lmx-evidence/"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmx-dependency-verification
          retention-days: 7
          path: ${{ runner.temp }}/lmx-evidence/
          if-no-files-found: error
