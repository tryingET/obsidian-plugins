name: lmx-verification-handoff

on:
  push:
    branches: [main]
    paths: [.github/workflows/lmx-verification-handoff.yml]

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: github.repository == 'tryingET/obsidian-plugins' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconstruct checksum-pinned correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/lmx-evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          request = urllib.request.Request('https://api.github.com/repos/tryingET/obsidian-plugins/git/blobs/7faa9a9348a4b01a0d058689027de3e1828e51ce', headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              encoded = base64.b64decode(json.load(response)['content'])
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'dce8992fd5de1ba0e88fcadda81278fce2b704cdbdd8167fba89100654ceadc9'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'lmx-evidence/settings.patch').write_bytes(patch)
          PY
      - name: Prove native host receiver before applying implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          patch="$RUNNER_TEMP/lmx-evidence/settings.patch"
          git apply --index --include='packages/obsidian-excalidraw-layer-manager/docs/*' "$patch"
          git commit -m 'docs(layer-manager): specify native settings receiver ownership'
          git apply --index --include='packages/obsidian-excalidraw-layer-manager/test/*' "$patch"
          set +e
          npm --prefix packages/obsidian-excalidraw-layer-manager test -- test/runtime.sidepanel-quickmove-persistence.integration.test.ts --reporter=json --outputFile="$RUNNER_TEMP/lmx-evidence/settings-red.json" > "$RUNNER_TEMP/lmx-evidence/settings-red.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'lmx-evidence/settings-red.json').read_text())
          assert result['numFailedTests'] == 1 and result['numPassedTests'] == 9, result
          print('Test-first proof: 1 failed, 9 passed before correction')
          PY
          git commit -m 'test(layer-manager): require originating EA for native settings persistence'
          git apply --index --include='packages/obsidian-excalidraw-layer-manager/src/*' "$patch"
          git commit -m 'fix(layer-manager): bind native settings methods at renderer boundary'
          test "$(git rev-parse HEAD:packages/obsidian-excalidraw-layer-manager/src)" = 783ddbee2dad37cbe289f1812ef4be3a02c56d20
          test "$(git rev-parse HEAD:packages/obsidian-excalidraw-layer-manager/test)" = cfd2ac0f1d130d47abb43a4fe77670fda21a804c
      - name: Run unchanged repository gate
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/lmx-evidence/check.log"
      - name: Build and sync lab vault with byte and hash proof
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/obsidian-excalidraw-layer-manager run build
          export LMX_VAULT_TARGET="$GITHUB_WORKSPACE/apps/lab-vault/Excalidraw/Scripts/LayerManager.md"
          (cd packages/obsidian-excalidraw-layer-manager && node build/sync-to-vault.mjs)
          cmp packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md "$LMX_VAULT_TARGET"
          sha256sum packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md "$LMX_VAULT_TARGET" | tee "$RUNNER_TEMP/lmx-evidence/bundle-sha256.txt"
          cp packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md "$RUNNER_TEMP/lmx-evidence/LayerManager.md"
          git add apps/lab-vault/Excalidraw/Scripts/LayerManager.md
          git commit -m 'build(layer-manager): sync verified native-settings bundle'
      - name: Publish only a green fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
          git log -4 --oneline > "$RUNNER_TEMP/lmx-evidence/published-commits.txt"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmx-settings-verification
          retention-days: 7
          path: ${{ runner.temp }}/lmx-evidence/
          if-no-files-found: error
