name: lmx-verification-handoff

on:
  push:
    branches: [main]
    paths: [.github/workflows/lmx-verification-handoff.yml]

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: github.repository == 'tryingET/obsidian-plugins' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reconstruct checksum-pinned recovery changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lmx-evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          request = urllib.request.Request('https://api.github.com/repos/tryingET/obsidian-plugins/git/blobs/99e36f1cb4417c9e3cee62bab9614b25d893706d', headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              encoded = base64.b64decode(json.load(response)['content'])
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd710bc57797361eddb003e5ebff4d0b78115d0fdf981cf5afc09968674e2e2dc'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'lmx-evidence/recovery.patch').write_bytes(patch)
          PY
      - name: Commit observed behavior and failing regression before implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          patch="$RUNNER_TEMP/lmx-evidence/recovery.patch"
          git apply --index --include='packages/obsidian-excalidraw-layer-manager/docs/*' "$patch"
          git commit -m 'docs(layer-manager): record observed same-leaf recovery behavior before regression'
          git apply --index --include='packages/obsidian-excalidraw-layer-manager/test/*' "$patch"
          set +e
          npm --prefix packages/obsidian-excalidraw-layer-manager test -- test/runtime.sidepanel-lifecycle-contract.integration.test.ts --reporter=json --outputFile="$RUNNER_TEMP/lmx-evidence/tdd-red.json" > "$RUNNER_TEMP/lmx-evidence/tdd-red.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'lmx-evidence/tdd-red.json').read_text())
          assert result['numFailedTests'] == 1 and result['numPassedTests'] == 12, result
          print('Test-first proof: 1 failed, 12 passed before recovery implementation')
          PY
          git commit -m 'test(layer-manager): reproduce real-host same-leaf replacement gap'
          git apply --index --include='packages/obsidian-excalidraw-layer-manager/src/*' "$patch"
          git commit -m 'fix(layer-manager): recover observed same-leaf replacements on bounded layout signal'
          test "$(git rev-parse HEAD:packages/obsidian-excalidraw-layer-manager/src)" = 259e84a61f230845da0b83aa386e5fbc0055b9fd
          test "$(git rev-parse HEAD:packages/obsidian-excalidraw-layer-manager/test)" = 23db2f72f28f58984491603e898e8c92944b6306
      - name: Run unchanged repository gate
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/lmx-evidence/check.log"
      - name: Build and sync the checked-in lab vault with deployment proof
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/obsidian-excalidraw-layer-manager run build
          export LMX_VAULT_TARGET="$GITHUB_WORKSPACE/apps/lab-vault/Excalidraw/Scripts/LayerManager.md"
          (cd packages/obsidian-excalidraw-layer-manager && node build/sync-to-vault.mjs)
          cmp packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md "$LMX_VAULT_TARGET"
          sha256sum packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md "$LMX_VAULT_TARGET" | tee "$RUNNER_TEMP/lmx-evidence/bundle-sha256.txt"
          cp packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md "$RUNNER_TEMP/lmx-evidence/LayerManager.md"
          git add apps/lab-vault/Excalidraw/Scripts/LayerManager.md
          if ! git diff --cached --quiet; then
            git commit -m 'build(layer-manager): sync same-leaf recovery bundle to the lab vault'
          fi
      - name: Publish only a green fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
          git log -4 --oneline | tee "$RUNNER_TEMP/lmx-evidence/published-commits.txt"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmx-sameleaf-verification
          retention-days: 7
          path: ${{ runner.temp }}/lmx-evidence/
          if-no-files-found: error
