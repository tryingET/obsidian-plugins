name: lmx-verification-handoff
on:
  push:
    branches: [main]
    paths: [.github/workflows/lmx-verification-handoff.yml]
permissions:
  contents: read
jobs:
  verify-and-publish:
    if: github.repository == 'tryingET/obsidian-plugins' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconstruct reviewed documentation with exact input and output hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lmx-docs"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lmx-docs'
          parts = [
              ('1cafe755a2606e1649cd09df2ca1dc969df1ded2', 'a6ca118654d2b227950c0fe880d391091ae16c93'),
              ('d5b8311c80e8b800dab20e830134b3eb30576bfb', 'a03184bf6f216737450ed1ee7db72f17c866f9fb'),
              ('e3c9d010a1dfcb8c14f9cc262495bec23beda323', 'e3c9d010a1dfcb8c14f9cc262495bec23beda323'),
              ('61103dd0db09837c4f73a91aefcdc7b21e81e701', '61103dd0db09837c4f73a91aefcdc7b21e81e701'),
              ('e9e7f8de2ee54a75af3bc81c1c78607741128ad2', 'e9e7f8de2ee54a75af3bc81c1c78607741128ad2'),
              ('f55aff6c48947f4768b52d172220ed4daeb83305', 'f55aff6c48947f4768b52d172220ed4daeb83305'),
              ('826fa48f3f0df0cd97ce03b713b2acb81f4291e2', '826fa48f3f0df0cd97ce03b713b2acb81f4291e2'),
              ('5cf2c1b58a5d788cd5d38a1fc44c460c3045c569', '5cf2c1b58a5d788cd5d38a1fc44c460c3045c569'),
              ('21e209308e2dc24e379db5928d0f3ab3f043290d', '21e209308e2dc24e379db5928d0f3ab3f043290d'),
              ('1d360d6c31385d07b95eaefc1aa871a7332ab70a', '1d360d6c31385d07b95eaefc1aa871a7332ab70a'),
              ('8e274b1a210a3e720625e9f84c42bf792c938dad', '8e274b1a210a3e720625e9f84c42bf792c938dad'),
              ('b17c59969d23adb20fa16b0558ef7cbc99caf13d', 'b17c59969d23adb20fa16b0558ef7cbc99caf13d'),
              ('a9f4a2fa565dfb395185b82483a8b6baba889e62', 'a9f4a2fa565dfb395185b82483a8b6baba889e62'),
              ('da512f47620b7f423781ec57d02e9cdcc6272f32', '63003e4c57d05fff23fb8abd2fd6856b5121d242'),
              ('94153f61fd797af7e6db677214352e30c65f031d', '94153f61fd797af7e6db677214352e30c65f031d'),
          ]
          encoded, mismatches = b'', []
          for index, (identifier, expected) in enumerate(parts):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/tryingET/obsidian-plugins/git/blobs/{identifier}',
                  headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = base64.b64decode(json.load(response)['content'])
              (evidence / f'transport-{index}.txt').write_bytes(raw)
              part = b''.join(raw.split())
              # Transport transcription only: the pre-existing chunk and payload hashes remain authoritative.
              if index == 0:
                  part = part.replace(b'jqfKiyCusmL', b'jqfKiyusmL')
              if index == 1:
                  part = part.replace(b'Lu1srLCN77j', b'Lu1srLCN7j').replace(b'piE0l0al7p', b'piE0al7p')
              actual = hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest()
              if actual != expected:
                  mismatches.append({'part': index, 'actual': actual, 'expected': expected})
              encoded += part
          (evidence / 'transport-check.json').write_text(json.dumps(mismatches, indent=2))
          assert not mismatches, mismatches
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'ef794e8c07e96fa2c79d8adfffccc9f84e9f17d16a1c25a2be7c4f488ffef7e9'
          manifest = json.loads(data)
          assert manifest['base'] == 'dc6defb5553f2946bcf75d15a04e7bf0efad4029'
          assert len(manifest['files']) == 50
          paths = [item['path'] for item in manifest['files']]
          assert len(set(paths)) == len(paths)
          pending = []
          for item in manifest['files']:
              relative = pathlib.PurePosixPath(item['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              name = str(relative)
              assert 'docs/_core/' not in name and not name.endswith('next_session_prompt.md')
              allowed_md = name.endswith('.md') and (name == 'README.md' or name.startswith(('docs/', 'apps/lab-vault/', 'packages/obsidian-excalidraw-layer-manager/')))
              allowed_json = name.endswith('.json') and name.startswith('packages/obsidian-excalidraw-layer-manager/docs/evidence/')
              assert allowed_md or allowed_json, name
              target = root / relative
              assert target.resolve().is_relative_to(root) and not target.is_symlink(), name
              before = target.read_bytes() if target.exists() else b''
              assert hashlib.sha256(before).hexdigest() == item['before'], name
              assert 0 <= item['start'] <= item['end'] <= len(before), name
              after = before[:item['start']] + item['text'].encode() + before[item['end']:]
              assert hashlib.sha256(after).hexdigest() == item['after'], name
              pending.append((target, after))
          for target, after in pending:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(after)
          (evidence / 'reviewed-manifest.json').write_bytes(data)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          print('Reconstructed 50 reviewed documentation/evidence files byte-for-byte')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(layer-manager): reconcile guidance and evidence with the published implementation'
      - name: Record external documentation verification availability without claiming a pass
        shell: bash
        run: |
          set +e
          node /home/tryinget/ai-society/core/agent-scripts/scripts/docs-list.mjs --docs packages/obsidian-excalidraw-layer-manager/docs --strict > "$RUNNER_TEMP/lmx-docs/docs-strict.log" 2>&1
          echo "$?" > "$RUNNER_TEMP/lmx-docs/docs-strict.exit"
          exit 0
      - name: Run unchanged repository gate
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/lmx-docs/check.log"
      - name: Prove no production or dependency change and publish only a green fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:packages/obsidian-excalidraw-layer-manager/src)" = 783ddbee2dad37cbe289f1812ef4be3a02c56d20
          test "$(git rev-parse HEAD:packages/obsidian-excalidraw-layer-manager/test)" = cfd2ac0f1d130d47abb43a4fe77670fda21a804c
          git diff --exit-code "$GITHUB_SHA" HEAD -- package.json package-lock.json packages/obsidian-excalidraw-layer-manager/package.json apps/lab-vault/testing.md apps/lab-vault/Excalidraw/Scripts/LayerManager.md
          git diff --exit-code
          cmp packages/obsidian-excalidraw-layer-manager/dist/LayerManager.md apps/lab-vault/Excalidraw/Scripts/LayerManager.md
          echo '651e881e6bfadd12f82513b6ff66cb30138333b4b7f1f86d8d972750bf220d1b  apps/lab-vault/Excalidraw/Scripts/LayerManager.md' | sha256sum --check
          git diff "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/lmx-docs/published-docs.patch"
          git show -s --format='%H%n%T%n%s' HEAD > "$RUNNER_TEMP/lmx-docs/published-commit.txt"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmx-documentation-publication
          retention-days: 30
          path: ${{ runner.temp }}/lmx-docs/
          if-no-files-found: error
