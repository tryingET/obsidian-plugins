name: lmx-host-fixture

on:
  push:
    branches: [main]
    paths: [.github/workflows/lmx-host-fixture.yml]

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch pinned public desktop and plugin assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lmx-host/excalidraw"
          cd "$RUNNER_TEMP/lmx-host"
          curl --fail --location --retry 2 'https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/Obsidian-1.13.7.AppImage' -o Obsidian-1.13.7.AppImage
          for file in main.js manifest.json styles.css; do
            curl --fail --location --retry 2 "https://github.com/zsviczian/obsidian-excalidraw-plugin/releases/download/2.27.3/$file" -o "excalidraw/$file"
          done
          cat > SHA256SUMS <<'HASHES'
          e0d8e0a611624de8c9c7dcd8a9e648279fb0a0d552faa1312b7e4f3a5fa72663  Obsidian-1.13.7.AppImage
          8275e85d0f6314654a3d5ad86125d2e1b0018b4ffd60eddab2bbc8eefa0e13c1  excalidraw/main.js
          30bfc399dae79f7ca1ce050bb2a9497aada72ef576be831375571f5444f428a2  excalidraw/manifest.json
          4a9b329e24abdc310ccd8a0fb91c7863619ceea2a0d266981a86d6c5ebd1abea  excalidraw/styles.css
          HASHES
          sha256sum --check SHA256SUMS
      - name: Export verified fixtures
        uses: actions/upload-artifact@v4
        with:
          name: lmx-host-fixture
          path: ${{ runner.temp }}/lmx-host/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
